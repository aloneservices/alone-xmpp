server {
  listen 8087;
  server_tokens off;
  access_log off;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location = /web { return 301 /web/; }
  location /web/ {
    try_files $uri /web/index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://upload.alo.ne blob: data:; connect-src 'self' wss://chat.alo.ne https://upload.alo.ne; frame-ancestors https://alo.ne; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Access-Control-Allow-Origin "https://check.alo.ne" always;
  }
  location /web/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin "https://check.alo.ne" always;
  }

  location /legal/ {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; frame-ancestors https://alo.ne; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  location /public/ {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  location /check/ {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src https://raw.githubusercontent.com https://chat.alo.ne https://alo.ne https://afra.id https://ra.pe https://e.rip https://sexu.al https://deni.al https://karamb.it https://trapst.ar https://drugabu.se; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  location / { return 404; }
}
